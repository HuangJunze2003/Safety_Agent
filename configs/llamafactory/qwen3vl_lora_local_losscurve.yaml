### 与 qwen3vl_lora_local.yaml 同参的完整训练（绝对路径，便于单独传一个 yaml 给 llamafactory-cli）

stage: sft
do_train: true
finetuning_type: lora
lora_target: q_proj,k_proj,v_proj,o_proj,gate_proj,up_proj,down_proj
lora_rank: 64
lora_alpha: 128
lora_dropout: 0.05

model_name_or_path: /root/autodl-tmp/Safety_Agent/models/base-vl
template: qwen2_vl

dataset_dir: /root/autodl-tmp/Safety_Agent/data/data_processed
dataset: safety_qwen3vl_sft_cleaned_image
max_samples: 100000
cutoff_len: 2048
overwrite_cache: true
preprocessing_num_workers: 8

output_dir: /root/autodl-tmp/Safety_Agent/outputs/qwen3vl_lora_local
logging_steps: 1
save_steps: 50
plot_loss: true
overwrite_output_dir: true

per_device_train_batch_size: 1
gradient_accumulation_steps: 8
learning_rate: 0.00005
num_train_epochs: 4.0
lr_scheduler_type: cosine
warmup_ratio: 0.03
bf16: true
gradient_checkpointing: true

val_size: 0.1
per_device_eval_batch_size: 1
eval_strategy: steps
eval_steps: 50

freeze_vision_tower: false
